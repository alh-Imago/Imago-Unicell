[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imago-vm"
version = "0.2.0"
description = "Imago UniCell — universal parallel compute fabric (VM, compiler, server, MathTrix)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Imago UniCell Project" }
]
keywords = [
    "unicell", "fpga", "parallel", "compute", "fabric",
    "compiler", "vm", "mathtrix", "nor", "cellular"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"

# Core VM runs on pure Python — no mandatory dependencies.
# Optional extras for hardware, server, and LLVM support.
dependencies = []

[project.optional-dependencies]
server  = ["flask>=3.0"]                        # REST server + browser frontend
fpga    = ["pyserial>=3.5"]                     # iCEBreaker / Arria 10 UART bridge
llvm    = ["llvmlite>=0.40.0"]                  # C/C++/Rust → LLVM IR → cells
all     = ["flask>=3.0", "pyserial>=3.5", "llvmlite>=0.40.0"]

[project.scripts]
imago            = "imago.cli:main"              # general CLI: run, compile, info
imago-workbench  = "imago.cli:workbench_main"   # developer workbench UI
imago-server     = "imago.cli:server_main"      # REST server + browser frontend
imago-deploy     = "imago.cli:deploy_main"      # lightweight PTT-only deployed server

[project.urls]
Repository = "https://github.com/alh-Imago/Imago-Unicell"
Issues     = "https://github.com/alh-Imago/Imago-Unicell/issues"

[tool.setuptools]
# Core VM files live in repo root alongside the imago/ package.
# include_package_data picks up everything listed in MANIFEST.in.
packages = ["imago"]

[tool.setuptools.package-data]
imago = [
    "examples/*.icm",               # bundled example programs
]

# Non-package files included via MANIFEST.in:
#   frontend/index.html             — browser UI for imago-server
#   models/example_user_model.json  — user model template
#   hardware_config.json            — serial port config template
#   composer/unicell_composer.html  — standalone visual design tool
#   composer/README.md
#   docs/*.md                       — documentation

[tool.pytest.ini_options]
testpaths = ["tests/vm", "tests/fpga"]
python_files  = ["test_*.py"]
python_classes  = ["Test*"]
python_functions = ["test_*"]

markers = [
    "fpga: requires live iCEBreaker or Arria 10 hardware (skip with -m 'not fpga')",
    "vm:   pure Python VM tests — no hardware needed (default)",
    "slow: tests that take more than a few seconds",
]

# Run VM tests by default. Use 'pytest tests/fpga/' for hardware tests.
addopts = "--tb=short"

# Known test counts (as of 2026-06-08):
#   tests/vm/test_compiler_int32.py  — 133 tests
#   tests/vm/test_fp_tiles.py        — 236 tests
#   tests/fpga/test_sanity.py        — 31 tests (requires iCEBreaker hardware)
