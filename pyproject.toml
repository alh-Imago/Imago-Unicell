[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imago-vm"
version = "0.2.0"
description = "Imago UniCell — universal parallel compute fabric (VM, compiler, server, MathTrix)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Imago UniCell Project" }
]
keywords = [
    "unicell", "fpga", "parallel", "compute", "fabric",
    "compiler", "vm", "mathtrix", "nor", "cellular"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"

# Core VM runs on pure Python — no mandatory dependencies.
# Optional extras for hardware, server, and LLVM support.
dependencies = []

[project.optional-dependencies]
server  = ["flask>=3.0"]                        # REST server + browser frontend
fpga    = ["pyserial>=3.5"]                     # iCEBreaker / Arria 10 UART bridge
llvm    = ["llvmlite>=0.40.0"]                  # C/C++/Rust → LLVM IR → cells
all     = ["flask>=3.0", "pyserial>=3.5", "llvmlite>=0.40.0"]

[project.scripts]
# imago.cli's own package was archived (points.md #366) -- every one of
# these old entry points targeted the old compiler/workbench/format.
# The current equivalents are real scripts, not installed entry points
# yet: `python3 nano/dsl_cli_v1.py` to compile, `python3 nano/
# workbench_v1.py` to serve the browser workbench.

[project.urls]
Repository = "https://github.com/alh-Imago/Imago-Unicell"
Issues     = "https://github.com/alh-Imago/Imago-Unicell/issues"

[tool.setuptools]
# The old imago/ package was archived (points.md #366) -- nothing in
# nano/ is currently packaged as an installable module. This project
# is used by running scripts directly (python3 nano/dsl_cli_v1.py,
# python3 nano/workbench_v1.py), not via pip install, for now.
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests/vm", "tests/fpga"]
# Legacy/archived old-format test folders excluded from default collection --
# several contain module-level sys.exit(0) "SKIP" guards that crash pytest's
# own collection error handling with an INTERNALERROR on a bare `pytest` run
# (points.md #364's own finding). Kept in place for reference, not run by
# default. Run them explicitly by path if ever needed.
norecursedirs = ["tests/vm/legacy_full_cell", "tests/vm/legacy", "tests/vm/archive", "tests/design/legacy_full_cell"]
python_files  = ["test_*.py"]
python_classes  = ["Test*"]
python_functions = ["test_*"]

markers = [
    "fpga: requires live iCEBreaker or Arria 10 hardware (skip with -m 'not fpga')",
    "vm:   pure Python VM tests — no hardware needed (default)",
    "slow: tests that take more than a few seconds",
]

# Run VM tests by default. Use 'pytest tests/fpga/' for hardware tests.
addopts = "--tb=short"

# Known test counts (as of 2026-06-08):
#   tests/vm/test_compiler_int32.py  — 133 tests
#   tests/vm/test_fp_tiles.py        — 236 tests
#   tests/fpga/test_sanity.py        — 31 tests (requires iCEBreaker hardware)
