<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>UniCell Capability Table</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a1a;color:#ddd;font-family:monospace;font-size:13px;line-height:1.5;
  padding:0 0 60px 0;}
#topbar{display:flex;align-items:center;border-bottom:1px solid #224;background:#060610;
  height:46px;position:sticky;top:0;z-index:50;}
#topbar h1{font-size:13px;color:#88aaff;letter-spacing:2px;text-transform:uppercase;
  padding:0 18px;font-weight:normal;}
.tab{padding:0 16px;height:46px;line-height:46px;cursor:pointer;font-size:11px;color:#556;
  letter-spacing:2px;text-transform:uppercase;border-left:1px solid #224;}
.tab:hover{color:#aaa;}.tab.on{color:#88aaff;border-bottom:2px solid #88aaff;}
#tools{margin-left:auto;display:flex;gap:8px;padding:0 14px;}
#tools button{background:#0a0a1e;border:1px solid #336;color:#aaa;font-family:monospace;
  font-size:10px;letter-spacing:1px;padding:5px 11px;cursor:pointer;text-transform:uppercase;}
#tools button:hover{border-color:#88aaff;color:#88aaff;}
#search{background:#07071a;border-bottom:1px solid #1a1a2e;padding:7px 18px;}
#search input{background:#0a0a1e;border:1px solid #336;color:#ddd;font-family:monospace;
  font-size:12px;padding:5px 10px;width:340px;outline:none;}
#search input:focus{border-color:#88aaff;}
.wrap{padding:16px 18px;}
.view{display:none;}.view.on{display:block;}
h2{font-size:12px;color:#7788cc;letter-spacing:2px;text-transform:uppercase;
  margin:18px 0 8px 0;border-bottom:1px solid #1a1a2e;padding-bottom:5px;}
h2:first-child{margin-top:0;}
.intro{color:#778;font-size:12px;line-height:1.7;margin-bottom:10px;max-width:900px;}
table{width:100%;border-collapse:collapse;margin-bottom:14px;}
th{text-align:left;color:#556;font-size:10px;letter-spacing:1px;text-transform:uppercase;
  padding:6px 10px;border-bottom:1px solid #224;font-weight:normal;}
td{padding:6px 10px;border-bottom:1px solid #131325;vertical-align:top;font-size:12px;}
tr:hover td{background:#0e0e22;}
.mono{color:#9cf;}
.bits{color:#cc8;white-space:nowrap;}
.name{color:#8fa;font-weight:bold;}
.desc{color:#aab;line-height:1.6;}
.cost{color:#c97;white-space:nowrap;font-size:11px;}
.tag{display:inline-block;background:#141430;border:1px solid #335;color:#88aaff;
  font-size:9px;padding:1px 6px;border-radius:2px;margin-right:4px;letter-spacing:1px;}
.tag.warn{color:#e88;border-color:#533;}
.tag.ok{color:#8e8;border-color:#353;}
.hidden{display:none;}
#jsonview{white-space:pre;color:#9ab;font-size:11px;line-height:1.5;
  background:#07071a;border:1px solid #1a1a2e;padding:14px;overflow:auto;}
.note{color:#667;font-size:11px;font-style:italic;margin:6px 0 14px 0;line-height:1.6;}
code{color:#9cf;background:#10102a;padding:1px 5px;border-radius:2px;}
</style></head>
<body>
<div id="topbar">
  <h1>UniCell Capability Table</h1>
  <div class="tab on" data-v="methods">Methodology</div>
  <div class="tab" data-v="opcodes">Opcodes</div>
  <div class="tab" data-v="gates">Gates</div>
  <div class="tab" data-v="combos">Combinations</div>
  <div class="tab" data-v="json">JSON</div>
  <div id="tools">
    <button id="copybtn">Copy JSON</button>
    <button id="dlbtn">Download JSON</button>
  </div>
</div>
<div id="search"><input id="q" placeholder="filter by name / description / bits..."></div>

<!-- ════════════════ SINGLE SOURCE OF TRUTH ════════════════
  This JSON is the authoritative machine-readable cell capability spec. The human tables
  below are RENDERED from it (no second copy -> no drift). The compiler imports the SAME
  object (Copy/Download JSON, or parse #spec from this file). All values verified against
  fpga/verilog/unicell64.v + gate_states.py. cmd_latch bit-ranges and cmd_data write-map
  must match the RTL — keep this file in step with the cell (an RTL cross-check is the
  intended guard against drift).
-->
<script id="spec" type="application/json">
{
  "schema": "unicell-capability/1",
  "verified_against": ["fpga/verilog/unicell64.v", "fpga/verilog/unicell_array64.v", "gate_states.py"],
  "word": {
    "cmd_latch_bits": 64,
    "lower_half": "cmd_latch[31:0] = cell internal state (topology/addr/flags), loaded by RECONFIGURE / LOAD_AT",
    "upper_half": "cmd_latch[63:32] = methodology (shift/mask/lanes), loaded by SET_METHOD from cmd_data[31:0]",
    "set_method_map": "SET_METHOD writes cmd_latch[63:32] from cmd_data[31:0]; so cmd_latch[32+k] = cmd_data[k]"
  },
  "methodology_fields": [
    {"name":"nibble_mask","cmd_latch":"[39:32]","cmd_data":"[7:0]","width":8,
     "desc":"Per-nibble BLOCK(1)/PASS(0) applied to the input operand (with mask_en). Each bit gates one 4-bit nibble of the 32-bit word.",
     "silicon":"proven","cost":"flat (AND on input path)"},
    {"name":"mask_en","cmd_latch":"[40]","cmd_data":"[8]","width":1,
     "desc":"1 = nibble mask active (input operand & nibble_keep). 0 = mask bypassed.",
     "silicon":"proven","cost":"flat"},
    {"name":"shift_amt","cmd_latch":"[46:41]","cmd_data":"[14:9]","width":6,
     "desc":"Shift amount 0..31 (shared by in-shift, out-shift and lanes). [44:41]=nibble*4, [46:45]=sub-nibble.",
     "silicon":"proven","cost":"the shifter (one stage)"},
    {"name":"in_shift_en","cmd_latch":"[47]","cmd_data":"[15]","width":1,
     "desc":"Shift the INPUT operand LEFT by shift_amt BEFORE the gate. (This is the op the packed adder folds each KS '<<span' into.)",
     "silicon":"proven","cost":"flat (folds into shifter)"},
    {"name":"out_shift_en","cmd_latch":"[48]","cmd_data":"[16]","width":1,
     "desc":"Shift the RESULT RIGHT by shift_amt AFTER the gate. Internal feedback state (a_data/loop) keeps the UNSHIFTED result.",
     "silicon":"proven","cost":"flat"},
    {"name":"lane_cut","cmd_latch":"[51:49]","cmd_data":"[19:17]","width":3,
     "desc":"Cut bits for the 3 inter-byte boundaries (bit8/bit16/bit24) on the OUT-SHIFT. 0=connected, 1=cut. Cutting = bits that cross that boundary drop -> 4x 8-bit lanes / 16+16 / asymmetric splits. Shared shift_amt across lanes.",
     "silicon":"proven","cost":"flat (parallel kill-mask, one AND)"},
    {"name":"reserved","cmd_latch":"[63:52]","cmd_data":"[31:20]","width":12,
     "desc":"Reserved (must be zero). 12 bits of runway. Per design rule, spend on opcodes that COMBINE existing stages, not new combinational depth.",
     "silicon":"-","cost":"-"}
  ],
  "pipeline_order": "input -> in-shift(L) -> nibble-mask -> GATE(A,B) -> out-shift(R) -> lane-cut -> emit",
  "opcodes": [
    {"op":1,"hex":"0x01","name":"CMD_DATA_WRITE / INJECT","auth":false,"gating":"host inject onto bus",
     "args":"cmd_data[31:16]=target addr, full cmd_data = value. 1st arrival stored as A, 2nd fires.",
     "desc":"Inject data onto the bus toward an address. Two injects to the same cell = two-arrival fire.","silicon":"proven"},
    {"op":2,"hex":"0x02","name":"CMD_SET_INPUT_ADDR","auth":true,"gating":"addr_match (held target)",
     "args":"cmd_data[15:0] = input_address","desc":"Set a cell's input address (which bus address it listens on).","silicon":"proven"},
    {"op":3,"hex":"0x03","name":"CMD_SET_OUTPUT_ADDR","auth":true,"gating":"addr_match (held target)",
     "args":"cmd_data[15:0] = output_address","desc":"Set a cell's output address (where its result is emitted), output_set=1.","silicon":"proven"},
    {"op":4,"hex":"0x04","name":"CMD_RECONFIGURE","auth":true,"gating":"broadcast + auth",
     "args":"cmd_data[31:0] = full cmd_latch lower half (topology + flags); auth_mask in [18:11] boot-only",
     "desc":"Load a cell's lower half (topology/gate + arm/flags). Run-mode write gated to NOT touch auth (clause 3).","silicon":"proven"},
    {"op":7,"hex":"0x07","name":"CMD_BOOT_COMMIT","auth":true,"gating":"BOOT STATE ONLY",
     "args":"accept logical addr + auth_mask, then flip to run mode",
     "desc":"One-time boot write of logical address + auth, then commits the cell to run mode (auth write-once).","silicon":"proven"},
    {"op":14,"hex":"0x0E","name":"CMD_SET_LOGICAL","auth":true,"gating":"boot walk",
     "args":"logical input addr","desc":"Set logical input address, suppress physical ID. Array-targeted boot walk.","silicon":"proven"},
    {"op":23,"hex":"0x17","name":"CMD_LOAD_AT","auth":true,"gating":"addr_match (held target) + auth",
     "args":"cmd_data = per-cell config (topology[9:0], command_cell[10], arm[11], auth_mask[30:23] boot-only)",
     "desc":"Targeted reconfigure: config lands on ONE cell via its addr_match comparator (target on the address lane). Per-cell heterogeneous load.","silicon":"proven"},
    {"op":24,"hex":"0x18","name":"CMD_SET_TARGET","auth":false,"gating":"TOP-ONLY (latch)",
     "args":"cmd_data[15:0] = target address","desc":"Top-level latch holding the target address across a two-pulse sequence; ops 2/3/23/25 ride this held target.","silicon":"proven"},
    {"op":25,"hex":"0x19","name":"CMD_SET_METHOD","auth":true,"gating":"addr_match (held target) + auth",
     "args":"cmd_data[31:0] -> cmd_latch[63:32] (the methodology half: shift/mask/lanes per the field map)",
     "desc":"Write the 64-bit methodology half onto the held target. Same gating as LOAD_AT. (Loader-facing four-state encoding is a separate deferred decision.)","silicon":"proven"},
    {"op":26,"hex":"0x1A","name":"CMD_DBG_SELECT","auth":false,"gating":"array-level, DEV builds only",
     "args":"cmd_data[clog2(NUM_CELLS)-1:0] = cell index","desc":"Pick which cell drives the debug readback ports. Side-effect-free (cells have no op-26 decode). DEBUG_SELECT=1 builds only (dev); off in production.","silicon":"proven"}
  ],
  "gates": [
    {"name":"GS_PASS","hex":"0x000","desc":"output = A (first arrival, stored in a_data). All gates bypassed.","silicon":"proven"},
    {"name":"GS_PASS_B","hex":"0x02C","desc":"output = B (second arrival, the trigger).","silicon":"proven"},
    {"name":"GS_NOT","hex":"0x001","desc":"NOT(A) = NOR(A,A). g0 active.","silicon":"proven"},
    {"name":"GS_NOT_B","hex":"0x002","desc":"NOT(B). g1 active.","silicon":"proven"},
    {"name":"GS_NOR","hex":"0x004","desc":"NOR(A,B). The substrate primitive (g2).","silicon":"proven"},
    {"name":"GS_AND","hex":"0x007","desc":"AND(A,B). g0+g1+g2.","silicon":"proven"},
    {"name":"GS_OR","hex":"0x024","desc":"OR(A,B). Used for chain pass-through (OR(0,B)=B).","silicon":"proven"},
    {"name":"GS_NAND","hex":"0x027","desc":"NAND(A,B).","silicon":"proven"},
    {"name":"GS_XOR","hex":"0x0BC","desc":"XOR(A,B). Half-adder sum; KS partial sum.","silicon":"proven"},
    {"name":"GS_XNOR","hex":"0x03C","desc":"XNOR(A,B): 1 if A==B.","silicon":"proven"},
    {"name":"GS_ZERO","hex":"0x030","desc":"always 0.","silicon":"proven"},
    {"name":"GS_ONE","hex":"0x0B0","desc":"always 1.","silicon":"proven"}
  ],
  "combinations": [
    {"name":"field-extract","stages":"out_shift_en + lane_cut","desc":"Shift a field down to a boundary, cut lanes so everything above drops -> isolate byte/halfword N of the result. Free (two output stages, no added depth).","silicon":"stages proven; combo to be exercised"},
    {"name":"field-insert / deposit","stages":"in_shift_en + mask + GATE(OR)","desc":"Shift a value up to a target position, mask to clear the destination field, OR into the existing word -> place a value into field N. Pairs with field-extract for full field surgery.","silicon":"stages proven; combo to be exercised"},
    {"name":"packed add (KS stage)","stages":"in_shift_en + GATE(AND/OR/XOR)","desc":"Each Kogge-Stone prefix stage = stored in-shift (<<span) folded into an AND/XOR cell. 18-cell graph = a+b. Math + chain + two-source join all proven in sim.","silicon":"mechanisms proven in sim; full graph + silicon pending"},
    {"name":"sub-word shift (SIMD-ish)","stages":"out_shift_en + lane_cut(111)","desc":"4x 8-bit lanes, shared shift amount, bits drop at byte boundaries -> shift 4 packed bytes in parallel. Proven on silicon (0x01002340>>4 lanes -> 0x00000204).","silicon":"proven"}
  ],
  "design_rules": [
    "Verilog is ground truth — this table must track unicell64.v.",
    "Expressivity via OPCODE COMBINATIONS of the existing stages (lane/shift/mask), NOT new combinational depth. Opcodes are ~free; depth is the precious budget.",
    "A 4th combinational stage is a synth-timed multi-cycle exception or a cut — never a silent depth increase.",
    "Two-cycle reprogram can set a topology + up to THREE simultaneous methods — so most combinations need no dedicated opcode."
  ]
}
</script>

<div class="wrap">
  <div class="view on" id="v-methods"></div>
  <div class="view" id="v-opcodes"></div>
  <div class="view" id="v-gates"></div>
  <div class="view" id="v-combos"></div>
  <div class="view" id="v-json"><div id="jsonview"></div></div>
</div>

<script>
const spec = JSON.parse(document.getElementById('spec').textContent);
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sil = s => s==='proven' ? '<span class="tag ok">silicon</span>'
              : s && s!=='-' ? '<span class="tag warn">'+esc(s)+'</span>' : '';

function renderMethods(){
  let h = '<div class="intro">The methodology half — <code>cmd_latch[63:32]</code>, loaded by <code>SET_METHOD</code> (op 25) from <code>cmd_data[31:0]</code>. '+
    'Field bit <code>cmd_latch[32+k]</code> = <code>cmd_data[k]</code>. Pipeline order: <code>'+esc(spec.pipeline_order)+'</code></div>';
  h += '<table><tr><th>Field</th><th>cmd_latch</th><th>cmd_data</th><th>w</th><th>Description</th><th>Cost</th><th></th></tr>';
  for(const f of spec.methodology_fields){
    h += `<tr class="row"><td class="name">${esc(f.name)}</td><td class="bits">${esc(f.cmd_latch)}</td>`+
         `<td class="bits">${esc(f.cmd_data)}</td><td class="mono">${f.width}</td>`+
         `<td class="desc">${esc(f.desc)}</td><td class="cost">${esc(f.cost)}</td><td>${sil(f.silicon)}</td></tr>`;
  }
  h += '</table>';
  return h;
}
function renderOpcodes(){
  let h = '<div class="intro">Command opcodes (the only post-boot authority). Auth-gated commands need a matching auth token; addr-gated commands land on the held <code>SET_TARGET</code> address.</div>';
  h += '<table><tr><th>Op</th><th>Hex</th><th>Name</th><th>Auth</th><th>Gating</th><th>Args / Description</th><th></th></tr>';
  for(const o of spec.opcodes){
    h += `<tr class="row"><td class="mono">${o.op}</td><td class="mono">${esc(o.hex)}</td>`+
         `<td class="name">${esc(o.name)}</td><td class="${o.auth?'cost':'mono'}">${o.auth?'yes':'no'}</td>`+
         `<td class="desc">${esc(o.gating)}</td><td class="desc"><b>${esc(o.args)}</b><br>${esc(o.desc)}</td>`+
         `<td>${sil(o.silicon)}</td></tr>`;
  }
  h += '</table>';
  return h;
}
function renderGates(){
  let h = '<div class="intro">Gate / topology codes (the lower-half <code>topology[9:0]</code>, loaded by RECONFIGURE / LOAD_AT). The gate operates on A (first arrival) and B (second arrival / trigger).</div>';
  h += '<table><tr><th>Gate</th><th>Topology</th><th>Description</th><th></th></tr>';
  for(const g of spec.gates){
    h += `<tr class="row"><td class="name">${esc(g.name)}</td><td class="bits">${esc(g.hex)}</td>`+
         `<td class="desc">${esc(g.desc)}</td><td>${sil(g.silicon)}</td></tr>`;
  }
  h += '</table>';
  return h;
}
function renderCombos(){
  let h = '<div class="intro">Compositions of the existing stages — the combination space the compiler can plan over. Per the design rule, new capability comes from combining these, not from new hardware depth.</div>';
  h += '<table><tr><th>Combination</th><th>Stages used</th><th>Description</th><th></th></tr>';
  for(const c of spec.combinations){
    h += `<tr class="row"><td class="name">${esc(c.name)}</td><td class="bits">${esc(c.stages)}</td>`+
         `<td class="desc">${esc(c.desc)}</td><td>${sil(c.silicon)}</td></tr>`;
  }
  h += '</table>';
  h += '<h2>Design rules</h2><table>';
  for(const r of spec.design_rules) h += `<tr class="row"><td class="desc">${esc(r)}</td></tr>`;
  h += '</table>';
  return h;
}
document.getElementById('v-methods').innerHTML = renderMethods();
document.getElementById('v-opcodes').innerHTML = renderOpcodes();
document.getElementById('v-gates').innerHTML   = renderGates();
document.getElementById('v-combos').innerHTML  = renderCombos();
document.getElementById('jsonview').textContent = JSON.stringify(spec, null, 2);

// tabs
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  document.getElementById('v-'+t.dataset.v).classList.add('on');
});
// search filter
document.getElementById('q').oninput = e=>{
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.row').forEach(r=>{
    r.classList.toggle('hidden', q && !r.textContent.toLowerCase().includes(q));
  });
};
// export
document.getElementById('copybtn').onclick = ()=>{
  navigator.clipboard.writeText(JSON.stringify(spec,null,2));
  const b=document.getElementById('copybtn'); const t=b.textContent; b.textContent='Copied!';
  setTimeout(()=>b.textContent=t,1200);
};
document.getElementById('dlbtn').onclick = ()=>{
  const blob=new Blob([JSON.stringify(spec,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='unicell_capability.json'; a.click();
};
</script>
</body></html>
